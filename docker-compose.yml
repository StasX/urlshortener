services:
  server:
    build:
      context: ./server
    ports:
      - "${APP_PORT:?Set APP_PORT in .env}:5000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    build:
      context: ./db
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge
