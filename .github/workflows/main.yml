name: URL Shortener CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Python API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install application dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run Python tests
        run: |
          set -eo pipefail
          mkdir -p reports
          python -m unittest discover -s server/tests -v 2>&1 | tee reports/python.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  frontend:
    name: Vue TypeScript and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check and build Vue
        run: npm run build
      - name: Test API client
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test Vue browser flows
        run: npm run test:browser
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vue-browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: warn

  containers:
    name: Docker Compose and MongoDB integration
    # MongoDB 8.0 rejects newer Ubuntu runner kernels (SERVER-131779).
    # https://github.com/actions/runner-images/issues/15005
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: urlshortener-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create disposable CI environment
        run: |
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          template = Path('.env.example').read_text()
          Path('.env').write_text(template.replace('SECRET_KEY=', 'SECRET_KEY=' + secrets.token_hex(32), 1))
          PY
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start healthy containers
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check both containers run as non-root
        run: |
          test "$(docker compose exec -T server id -u)" != 0
          test "$(docker compose exec -T db id -u)" != 0
      - name: Check HTTP health endpoint
        run: curl --fail --silent --show-error http://localhost:5000/health
      - name: Test real MongoDB link lifecycle and access controls
        run: docker compose exec -T server python - < server/tests/smoke_compose.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test full Vue and JWT flow against running containers
        working-directory: frontend
        env:
          LIVE_E2E_BASE_URL: http://localhost:5000
        run: npm run test:browser
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p reports/containers
          docker compose ps --all > reports/containers/status.log
          docker compose logs --no-color > reports/containers/services.log 2>&1
      - name: Upload container results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-results
          path: reports/containers/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload full browser results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  checkov:
    name: Checkov infrastructure security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: python -m pip install --upgrade checkov

      - name: Scan Dockerfiles and GitHub Actions
        run: |
          set -eo pipefail
          mkdir -p reports/checkov
          checkov --directory . --framework dockerfile github_actions --compact 2>&1 | tee reports/checkov/checkov.log

      - name: Upload Checkov results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Checkov-results
          path: reports/checkov/
          retention-days: 14
          if-no-files-found: warn

  trivy:
    name: Trivy vulnerabilities and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Trivy report directory
        run: mkdir -p reports/trivy

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: json
          output: reports/trivy/trivy.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-dirs: .git,server/env,server/.venv,server/venv,frontend/node_modules,frontend/dist,reports

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Trivy-results
          path: reports/trivy/
          retention-days: 14
          if-no-files-found: warn

  bandit:
    name: Bandit Python security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: python -m pip install --upgrade bandit

      - name: Scan Python application and Gunicorn configuration
        run: |
          set -eo pipefail
          mkdir -p reports/bandit
          bandit --recursive server/src server/gunicorn.conf.py --severity-level medium --confidence-level medium --format json --output reports/bandit/bandit.json 2>&1 | tee reports/bandit/bandit.log

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Bandit-results
          path: reports/bandit/
          retention-days: 14
          if-no-files-found: warn
