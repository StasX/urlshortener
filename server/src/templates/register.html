{% extends "layout.html" %}
{% block title %} Sign up {% endblock title %}
{% block content %}
<div class="container">
    <form class="col-lg-6 col-md-8 col-sm-10 col-xs-12 register-form" method="post">
        <span class="eyebrow">Join Shorty</span>
        <h1>Start something short.</h1>
        <p class="muted">Create your free account. Make room for better links.</p>
        <div class="form-group">
            <label for="firstName">First Name:</label>
            <input type="text" class="form-control" id="firstName" name="firstName" placeholder="First Name" required minlength="2" maxlength="30" value="{{ request.form.get('firstName', '') }}">
        </div>
        <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Last Name" required minlength="2" maxlength="30" value="{{ request.form.get('lastName', '') }}">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Email" required minlength="5" maxlength="64" value="{{ request.form.get('email', '') }}">
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
        </div>
        <div class="form-group">
            <label for="repeatPassword">Repeat Password:</label>
            <input type="password" class="form-control" id="repeatPassword" name="repeatPassword" placeholder="Repeat Password" autocomplete="new-password" required>
        </div>
        <div>
            <button class="btn btn-md btn-dark">Sign up</button>
        </div>
        {% if error %}
        <div>
            <div class="error-message" role="alert">{{error}}</div>
            
        </div>
        {% endif %}
    </form>
</div>
{% endblock content %}
