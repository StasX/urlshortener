<header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
        <a class="brand" href="{{ url_for('home_view.render') }}"><span class="brand-icon" aria-hidden="true">&#8599;</span> Shorty<span class="brand-dot">.</span></a>
        <div class="nav-links">
            <a class="{{ 'active' if request.endpoint == 'home_view.render' else '' }}" href="{{ url_for('home_view.render') }}">Link tools</a>
            {% if user %}
            <a class="{{ 'active' if request.endpoint == 'dashboard_view.render' else '' }}" href="{{ url_for('dashboard_view.render') }}" id="dashboardLink">Dashboard</a>
            {% endif %}
        </div>
        <div class="nav-account">
            {% if user %}
            <span id="helloUser">Hi, {{ user.first_name }}</span>
            <div id="auth"><button type="button" class="nav-signout" onclick="logout()">Sign out</button></div>
            {% else %}
            <a class="nav-login" href="{{ url_for('auth_view.login') }}">Sign in</a>
            <a class="btn btn-dark btn-sm" href="{{ url_for('auth_view.register') }}">Get started <span aria-hidden="true">&#8599;</span></a>
            {% endif %}
        </div>
    </nav>
</header>
<div id="globalError" class="error-message global-error" role="alert" hidden></div>
